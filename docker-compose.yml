services:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - app
    networks:
      - locsy_net

  # Сервис приложения (PHP-FPM + Nginx)
  app:
    image: 'webdevops/php-nginx:8.2'
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    # Явно указываем Nginx, где находится публичная папка Laravel
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - PHP_UPLOAD_MAX_FILESIZE=100M
      - PHP_POST_MAX_SIZE=100M
      - NGINX_CLIENT_MAX_BODY_SIZE=100m
    # ВАЖНО: не подключаем .env как env_file — Laravel сам читает .env из
    # смонтированного кода. Иначе переменные (APP_ENV=local, DB_DATABASE=locsy)
    # попадают в окружение контейнера, перебивают .env.testing/phpunit.xml
    # и тесты могут уйти в рабочую базу.
    networks:
      - locsy_net

  # Сервис базы данных (PostgreSQL)
  db:
    image: 'postgres:15'
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - 'locsy_postgres_data:/var/lib/postgresql/data'
    # Переменные для создания базы данных
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - locsy_net

  # Сервис фронтенда (Quasar + Nginx)
  frontend:
    build:
      context: ../locsy-spa-quasar # Путь к вашему Quasar-проекту
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - locsy_net

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - locsy_net

# Docker Volume для сохранения данных БД
volumes:
  locsy_postgres_data:
    driver: local

networks:
  locsy_net:
    driver: bridge

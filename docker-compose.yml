services:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - app
    networks:
      - locsy_net

  # Сервис приложения (PHP-FPM + Nginx)
  app:
    image: 'webdevops/php-nginx:8.2'
    restart: unless-stopped
    ports:
      - "8080:80" # Изменен порт, чтобы не конфликтовать с фронтендом
    volumes:
      - .:/app
    working_dir: /app
    # Явно указываем Nginx, где находится публичная папка Laravel
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
    # Подключаем остальные переменные из .env файла
#    env_file:
#      - .env
    networks:
      - locsy_net

  # Сервис базы данных (PostgreSQL)
  db:
    image: 'postgres:15'
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - 'locsy_postgres_data:/var/lib/postgresql/data'
    # Переменные для создания базы данных
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - locsy_net

  # Сервис фронтенда (Quasar + Nginx)
  frontend:
    build:
      context: ../locsy-spa-quasar # Путь к вашему Quasar-проекту
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80" # Фронтенд будет доступен на порту 8000
    depends_on:
      - app
    networks:
      - locsy_net

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - locsy_net

# Docker Volume для сохранения данных БД
volumes:
  locsy_postgres_data:
    driver: local

networks:
  locsy_net:
    driver: bridge

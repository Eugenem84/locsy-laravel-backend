server {
    listen 80;
    server_name localhost;
    client_max_body_size 100m;


    # Проксируем запросы к API на бэкенд (Laravel)
    location /api/ {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксируем запросы к CSRF-cookie на бэкенд (Laravel)
    location /sanctum/csrf-cookie {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Админка Filament и её служебные пути (Livewire). В прод-конфиге nginx.conf
    # то же самое нужно внешнему nginx; локально этот конфиг заменяет прод через
    # docker-compose.override.yml, поэтому без этих location'ов /admin уходит в
    # SPA-fallback и отдаёт index.html вместо страницы входа Filament.
    location ~ ^/(admin|livewire|filament|up) {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Filament (public/js/filament, public/css/filament) — её тоже
    # отдаёт Laravel, иначе стили/скрипты админки вернут index.html SPA.
    location ~ ^/(js|css)/filament {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Подтверждение почты: ссылка из письма ведёт на backend (Laravel), который
    # затем редиректит на страницу SPA. Иначе /email/ уйдёт в SPA-фолбэк.
    location /email/ {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Все остальные запросы проксируем на фронтенд (Quasar/Vue)
    location / {
        proxy_pass http://frontend:80; # Фронтенд Nginx слушает на порту 80
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

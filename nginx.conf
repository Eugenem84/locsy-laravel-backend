server {
    listen 80;
    server_name locsy.prod.medovf2h.beget.tech;

    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name locsy.prod.medovf2h.beget.tech;

    ssl_certificate /etc/letsencrypt/live/locsy.prod.medovf2h.beget.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locsy.prod.medovf2h.beget.tech/privkey.pem;

    # API backend
    location /api/ {
        # Убрал слеш в конце, чтобы /api/ не обрезался
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sanctum CSRF endpoint must hit Laravel backend
    location /sanctum/ {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # <-- ДОБАВЛЕНО
    }
}
